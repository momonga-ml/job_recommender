version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: job_recommender_postgres
    environment:
      POSTGRES_DB: job_recommender
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - job_recommender_network
    restart: unless-stopped

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: job_recommender_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - job_recommender_network
    restart: unless-stopped

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job_recommender_api
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/job_recommender
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=your-secret-key-change-this-in-production
      - ENVIRONMENT=development
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    networks:
      - job_recommender_network
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped

  # Celery Worker
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job_recommender_celery_worker
    command: celery -A job_recommender.celery_app worker --loglevel=info --queues=scraping,processing,analysis,email
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/job_recommender
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=your-secret-key-change-this-in-production
      - ENVIRONMENT=development
    depends_on:
      - postgres
      - redis
    networks:
      - job_recommender_network
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped

  # Celery Beat (Scheduler)
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job_recommender_celery_beat
    command: celery -A job_recommender.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/job_recommender
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=your-secret-key-change-this-in-production
      - ENVIRONMENT=development
    depends_on:
      - postgres
      - redis
    networks:
      - job_recommender_network
    restart: unless-stopped

  # Flower (Celery Monitoring)
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job_recommender_flower
    command: celery -A job_recommender.celery_app flower --port=5555
    ports:
      - "5555:5555"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/job_recommender
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - job_recommender_network
    restart: unless-stopped

networks:
  job_recommender_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: